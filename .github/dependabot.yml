version: 2
updates:
  # Next.js App (apps/web)
  - package-ecosystem: npm
    directory: "/apps/web"
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: "Europe/Berlin"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "security"
    groups:
      next-core:
        patterns: ["next", "react", "react-dom"]
      prisma:
        patterns: ["@prisma/*", "prisma"]
      auth:
        patterns: ["jose", "otplib", "@upstash/*"]

  # API-Service (apps/api)
  - package-ecosystem: npm
    directory: "/apps/api"
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: "Europe/Berlin"
    open-pull-requests-limit: 3
    labels:
      - "dependencies"
      - "security"

  # GitHub Actions
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: monthly
    labels:
      - "ci"
      - "dependencies"
